version: "3.8"
services: 
  app:
    build: ./app/
    image: event-planner-api:1.0.0
    container_name: event-planner-api
    restart: unless-stopped
    env_file:
    - ./app/.env
    volumes:
      - ./app:/app
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  web:
    image: nginx:stable-alpine3.24-perl
    container_name: event-planner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - event-planner-network
  rabbitmq:
    image: rabbitmq:3-management
    container_name: event-planner-rabbitmq
    restart: on-failure
    ports:
      - "5672:5672"    
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./app/.env  # Тот же файл для RabbitMQ
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?err}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}

  database:
    image: postgres:15
    container_name: event-planner-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./app/.env  
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:-event_planner}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    name: event-planner-postgres-data  
    driver: local
  rabbitmq_data:
    name: event-planner-rabbitmq-data  
    driver: local

networks:
  event-planner-network:
    name: event-planner-network
    driver: bridge
